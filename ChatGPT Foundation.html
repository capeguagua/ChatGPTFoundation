document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

/\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<style>\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--color-bg)}\na{color:var(--color-accent-700)}\na:hover{color:var(--color-accent-800)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:16px;line-height:1.6\">\n\n<header style=\"position:sticky;top:0;z-index:10;background:color-mix(in srgb, var(--color-bg) 92%, transparent);backdrop-filter:blur(8px)\">\n  <nav class=\"nav\" style=\"max-width:1200px;margin:0 auto;padding:18px 28px;flex-wrap:wrap;row-gap:10px\">\n    <a href=\"#home\" class=\"nav-brand\" style=\"display:flex;align-items:center;gap:10px;font-size:20px\">\n      <img src=\"416ed286-4239-4eac-a54b-dd5627f11239\" alt=\"ChatGPT Foundation logo\" style=\"height:36px;width:auto\">\n      <span>ChatGPT Foundation<\u002Fspan>\n    <\u002Fa>\n    <div style=\"display:flex;gap:22px;flex-wrap:wrap\">\n      <a href=\"#home\" aria-current=\"{{ cur.home }}\">Home<\u002Fa>\n      <a href=\"#about\" aria-current=\"{{ cur.about }}\">About<\u002Fa>\n      <a href=\"#focus\" aria-current=\"{{ cur.focus }}\">Our Focus<\u002Fa>\n      <a href=\"#governance\" aria-current=\"{{ cur.governance }}\">Governance<\u002Fa>\n      <a href=\"#contact\" aria-current=\"{{ cur.contact }}\">Contact<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main style=\"flex:1;width:100%;max-width:1200px;margin:0 auto;padding:0 28px\">\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <section data-screen-label=\"Home\" style=\"padding:72px 0 88px;display:flex;flex-wrap:wrap-reverse;align-items:center;gap:48px 64px\">\n    <div style=\"flex:1 1 520px;min-width:0;max-width:720px;display:flex;flex-direction:column;gap:22px\">\n      <span class=\"tag tag-accent-2\" style=\"align-self:flex-start;font-size:13px;padding:5px 14px\">South African non-profit · Est. 2024<\u002Fspan>\n      <h1 style=\"font-size:clamp(40px,6vw,68px);line-height:1.05;margin:0;text-wrap:balance\">Advancing Accessible Digital Learning in South Africa<\u002Fh1>\n      <p style=\"font-size:19px;max-width:620px;margin:0;text-wrap:pretty\">ChatGPT Foundation is a South African non-profit company established in 2024. We are developing a foundation for future work in accessible artificial intelligence education, e-commerce and digital operations.<\u002Fp>\n      <p style=\"font-size:16px;max-width:580px;margin:0;color:var(--color-neutral-700);text-wrap:pretty\">Our long-term purpose is to help people from different educational backgrounds build practical knowledge, confidence and readiness for a changing digital economy.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:6px\">\n        <a href=\"#about\" class=\"btn btn-primary\" style=\"font-size:16px;padding:13px 24px;color:var(--color-bg)\">About the Foundation<\u002Fa>\n        <a href=\"#focus\" class=\"btn btn-secondary\" style=\"font-size:16px;padding:13px 24px;color:var(--color-text)\">Explore Our Focus<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:0 1 400px;min-width:260px;aspect-ratio:1;border-radius:50%;background:var(--color-neutral-100);display:grid;place-items:center\">\n      <img src=\"41ef927b-a95d-4620-a266-788e3bc65187\" alt=\"ChatGPT Foundation logo\" style=\"width:64%;height:auto\">\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:56px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;align-items:start\">\n    <h2 style=\"font-size:36px;margin:0\">Why We Exist<\u002Fh2>\n    <p style=\"font-size:18px;margin:0;max-width:640px;grid-column:span 2;text-wrap:pretty\">Rapid technological change creates new opportunities, but it can also widen existing social and economic inequalities. ChatGPT Foundation seeks to make practical digital knowledge more accessible, particularly for unemployed and underserved individuals in South Africa.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"padding:56px 0\">\n    <h2 style=\"font-size:36px;margin:0 0 28px\">Our Focus<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px\">\n      <div class=\"card\" style=\"padding:30px;gap:12px;background:var(--color-accent-200)\">\n        <span style=\"width:44px;height:44px;border-radius:50%;background:var(--color-accent)\"><\u002Fspan>\n        <div class=\"card-title\" style=\"font-size:22px;margin-top:8px\">Accessible AI Learning<\u002Fdiv>\n        <p class=\"card-body\" style=\"font-size:15px;opacity:1;color:var(--color-neutral-800)\">Developing future learning opportunities that introduce artificial intelligence in a practical, understandable and inclusive way.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:30px;gap:12px;background:var(--color-accent-2-200)\">\n        <span style=\"width:44px;height:44px;border-radius:50%;background:var(--color-accent-2)\"><\u002Fspan>\n        <div class=\"card-title\" style=\"font-size:22px;margin-top:8px\">E-commerce and Digital Operations<\u002Fdiv>\n        <p class=\"card-body\" style=\"font-size:15px;opacity:1;color:var(--color-neutral-800)\">Exploring training in online business management, customer service and digital operations that may support employment readiness.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:30px;gap:12px\">\n        <span style=\"width:44px;height:44px;border-radius:50%;background:var(--color-neutral-800)\"><\u002Fspan>\n        <div class=\"card-title\" style=\"font-size:22px;margin-top:8px\">Business and Community Support<\u002Fdiv>\n        <p class=\"card-body\" style=\"font-size:15px;opacity:1;color:var(--color-neutral-800)\">Building a foundation for future collaboration with businesses and community initiatives interested in practical and responsible uses of digital technology.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:40px 0 88px\">\n    <div style=\"border-radius:32px;background:var(--color-neutral-900);color:var(--color-neutral-100);padding:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span class=\"tag\" style=\"align-self:flex-start;background:var(--color-accent-2-300);color:var(--color-accent-2-900);font-size:13px;padding:5px 14px\">Current Status<\u002Fspan>\n        <h3 style=\"font-size:28px;margin:0;color:var(--color-neutral-100)\">Establishing our public presence<\u002Fh3>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;color:var(--color-neutral-200);grid-column:span 2;max-width:620px\">ChatGPT Foundation is currently establishing its public presence and developing its future programme framework. No public courses or applications are currently open.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"About\" style=\"padding:72px 0 40px;max-width:800px;display:flex;flex-direction:column;gap:18px\">\n    <span class=\"tag tag-accent\" style=\"align-self:flex-start;font-size:13px;padding:5px 14px\">About<\u002Fspan>\n    <h1 style=\"font-size:clamp(38px,5vw,56px);margin:0\">Who We Are<\u002Fh1>\n    <p style=\"font-size:19px;margin:0;text-wrap:pretty\">ChatGPT Foundation is an independent South African non-profit company registered in July 2024.<\u002Fp>\n    <p style=\"font-size:17px;margin:0;color:var(--color-neutral-700);text-wrap:pretty\">The organisation was established to explore how accessible education in artificial intelligence, e-commerce and online operations may contribute to employment readiness, business development and inclusive participation in the digital economy.<\u002Fp>\n  <\u002Fsection>\n  <section style=\"padding:40px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n    <div class=\"card\" style=\"padding:36px;gap:14px;background:var(--color-accent-200)\">\n      <div class=\"card-kicker\" style=\"font-size:12px;color:var(--color-accent-800)\">Our Mission<\u002Fdiv>\n      <p style=\"font-family:var(--font-heading);font-size:24px;line-height:1.3;margin:0\">To expand access to practical digital knowledge and create pathways through which individuals and communities can engage confidently with emerging technologies.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:36px;gap:14px;background:var(--color-accent-2-200)\">\n      <div class=\"card-kicker\" style=\"font-size:12px;color:var(--color-accent-2-800)\">Our Vision<\u002Fdiv>\n      <p style=\"font-family:var(--font-heading);font-size:24px;line-height:1.3;margin:0\">A society in which people from different educational and academic backgrounds have meaningful opportunities to learn about and participate in the digital economy.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"padding:48px 0 96px\">\n    <h2 style=\"font-size:36px;margin:0 0 24px\">Our Values<\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;max-width:860px\">\n      <sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"6\">\n        <span style=\"display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:var(--color-surface);font-size:17px;font-weight:600\">\n          <span style=\"width:10px;height:10px;border-radius:50%;background:var(--color-accent)\"><\u002Fspan>{{ v }}\n        <\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isFocus }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Our Focus\" style=\"padding:72px 0 40px;max-width:760px;display:flex;flex-direction:column;gap:18px\">\n    <span class=\"tag tag-accent\" style=\"align-self:flex-start;font-size:13px;padding:5px 14px\">Our Focus<\u002Fspan>\n    <h1 style=\"font-size:clamp(38px,5vw,56px);margin:0\">Future Areas of Work<\u002Fh1>\n    <p style=\"font-size:19px;margin:0\">The Foundation is developing its institutional framework around the following areas:<\u002Fp>\n  <\u002Fsection>\n  <section style=\"padding:24px 0 40px;display:flex;flex-direction:column;gap:12px\">\n    <sc-for list=\"{{ areas }}\" as=\"a\" hint-placeholder-count=\"5\">\n      <div style=\"display:grid;grid-template-columns:72px minmax(0,1fr);gap:20px;align-items:start;padding:28px 32px;border-radius:32px;background:var(--color-surface)\">\n        <span style=\"width:56px;height:56px;border-radius:50%;background:var(--color-bg);color:var(--color-accent-700);display:grid;place-items:center;font-family:var(--font-heading);font-size:22px\">{{ a.n }}<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 32px;align-items:baseline\">\n          <h3 style=\"font-size:24px;margin:0\">{{ a.title }}<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;color:var(--color-neutral-800)\">{{ a.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n  <section style=\"padding:16px 0 96px\">\n    <p style=\"margin:0;max-width:720px;padding:20px 26px;border-radius:24px;background:var(--color-accent-2-100);color:var(--color-accent-2-900);font-size:15px\">These areas describe the Foundation’s intended direction. Specific programmes will be announced only after they have been formally approved and prepared.<\u002Fp>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isGov }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Governance\" style=\"padding:72px 0 40px;max-width:760px;display:flex;flex-direction:column;gap:18px\">\n    <span class=\"tag tag-accent\" style=\"align-self:flex-start;font-size:13px;padding:5px 14px\">Governance<\u002Fspan>\n    <h1 style=\"font-size:clamp(38px,5vw,56px);margin:0\">Legal Information<\u002Fh1>\n  <\u002Fsection>\n  <section style=\"padding:8px 0 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px;align-items:start\">\n    <div style=\"border-radius:32px;background:var(--color-surface);padding:12px 28px\">\n      <sc-raw-table class=\"table\" style=\"font-size:16px\">\n        <sc-raw-tbody>\n          <sc-for list=\"{{ legal }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:16px 0;color:var(--color-neutral-700);width:48%\">{{ r.k }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:16px 0;font-weight:600\">{{ r.v }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <p style=\"font-size:18px;margin:0;max-width:440px;text-wrap:pretty\">The Foundation is governed in accordance with its founding documents and applicable South African law.<\u002Fp>\n  <\u002Fsection>\n  <section style=\"padding:40px 0 96px;max-width:780px;display:flex;flex-direction:column;gap:16px\">\n    <h2 style=\"font-size:36px;margin:0\">Transparency and Privacy<\u002Fh2>\n    <p style=\"font-size:17px;margin:0\">ChatGPT Foundation is committed to organisational transparency while protecting the privacy and security of its directors and stakeholders.<\u002Fp>\n    <p style=\"font-size:17px;margin:0;color:var(--color-neutral-700)\">Only information necessary for public accountability is published. Personal identification numbers, dates of birth, residential addresses, signatures, tax numbers and unredacted corporate records are not made available on this website.<\u002Fp>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Contact\" style=\"padding:72px 0 96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <span class=\"tag tag-accent\" style=\"align-self:flex-start;font-size:13px;padding:5px 14px\">Contact<\u002Fspan>\n      <h1 style=\"font-size:clamp(38px,5vw,56px);margin:0\">Contact the Foundation<\u002Fh1>\n      <p style=\"font-size:18px;margin:0\">General enquiries may be directed to:<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:4px\">\n        <div style=\"display:flex;flex-direction:column;padding:18px 24px;border-radius:24px;background:var(--color-surface)\">\n          <span style=\"font-size:13px;color:var(--color-neutral-700)\">Email<\u002Fspan>\n          <a href=\"mailto:info@chatgptfoundation.com\" style=\"font-size:18px;font-weight:600\">info@chatgptfoundation.com<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;padding:18px 24px;border-radius:24px;background:var(--color-surface)\">\n          <span style=\"font-size:13px;color:var(--color-neutral-700)\">Location<\u002Fspan>\n          <span style=\"font-size:18px;font-weight:600\">Cape Town, South Africa<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:14px;margin:0;color:var(--color-neutral-700);max-width:440px\">The official email address will become active after completion of the Foundation’s domain-email configuration.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-radius:36px;background:var(--color-surface);padding:36px;box-shadow:var(--shadow-sm)\">\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ submit }}\" style=\"display:flex;flex-direction:column;gap:18px\">\n          <h3 style=\"font-size:24px;margin:0\">Send an enquiry<\u002Fh3>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px\">\n            <div class=\"field\"><label for=\"f-name\" style=\"font-size:13px\">Name<\u002Flabel><input id=\"f-name\" class=\"input\" required=\"\" style=\"background:var(--color-bg);min-height:46px;font-size:15px\"><\u002Fdiv>\n            <div class=\"field\"><label for=\"f-email\" style=\"font-size:13px\">Email<\u002Flabel><input id=\"f-email\" type=\"email\" class=\"input\" required=\"\" style=\"background:var(--color-bg);min-height:46px;font-size:15px\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\"><label for=\"f-org\" style=\"font-size:13px\">Organisation (optional)<\u002Flabel><input id=\"f-org\" class=\"input\" style=\"background:var(--color-bg);min-height:46px;font-size:15px\"><\u002Fdiv>\n          <div class=\"field\"><label for=\"f-msg\" style=\"font-size:13px\">Message<\u002Flabel><textarea id=\"f-msg\" class=\"input\" required=\"\" rows=\"5\" style=\"background:var(--color-bg);border-radius:22px;padding:12px 16px;font-size:15px;min-height:140px\"><\u002Ftextarea><\u002Fdiv>\n          <button type=\"submit\" class=\"btn btn-primary\" style=\"align-self:flex-start;font-size:16px;padding:13px 26px\">Send message<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:24px 0\">\n          <span style=\"width:56px;height:56px;border-radius:50%;background:var(--color-accent-2)\"><\u002Fspan>\n          <h3 style=\"font-size:26px;margin:0\">Thank you<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;color:var(--color-neutral-800)\">Your enquiry has been received. We will respond once our correspondence channels are fully active.<\u002Fp>\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ reset }}\" style=\"font-size:15px;padding:10px 20px\">Send another<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<footer style=\"background:var(--color-neutral-900);color:var(--color-neutral-300);margin-top:auto\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:48px 28px;display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"width:64px;height:64px;border-radius:50%;background:var(--color-neutral-100);display:grid;place-items:center;flex:none\"><img src=\"416ed286-4239-4eac-a54b-dd5627f11239\" alt=\"ChatGPT Foundation logo\" style=\"width:44px;height:auto\"><\u002Fspan>\n        <span style=\"font-family:var(--font-heading);font-size:22px;color:var(--color-neutral-100)\">ChatGPT Foundation<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;max-width:560px\">\n        <p style=\"margin:0;font-size:14px\">ChatGPT Foundation is an independent South African non-profit company.<\u002Fp>\n        <a href=\"mailto:info@chatgptfoundation.com\" style=\"font-size:16px;font-weight:600;color:var(--color-accent-300)\">info@chatgptfoundation.com<\u002Fa>\n        <span style=\"font-size:14px\">Cape Town, South Africa<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px 28px;flex-wrap:wrap;font-size:13px;padding-top:20px;border-top:1px solid var(--color-neutral-800)\">\n      <span>© 2026 ChatGPT Foundation. All rights reserved.<\u002Fspan>\n      <span>Registration No. 2024/420153/08<\u002Fspan>\n      <a href=\"#governance\" style=\"color:var(--color-accent-300)\">Privacy Notice<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { page: 'home', sent: false };\n  pages = ['home', 'about', 'focus', 'governance', 'contact'];\n  onHash = () => {\n    const p = (location.hash || '#home').slice(1);\n    if (this.pages.includes(p) && p !== this.state.page) { this.setState({ page: p }); window.scrollTo(0, 0); }\n  };\n  componentDidMount() { window.addEventListener('hashchange', this.onHash); this.onHash(); }\n  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); }\n  renderVals() {\n    const p = this.state.page;\n    const cur = {}; this.pages.forEach(k => cur[k] = k === p ? 'page' : undefined);\n    return {\n      cur,\n      isHome: p === 'home', isAbout: p === 'about', isFocus: p === 'focus', isGov: p === 'governance', isContact: p === 'contact',\n      sent: this.state.sent, notSent: !this.state.sent,\n      submit: e => { e.preventDefault(); this.setState({ sent: true }); },\n      reset: () => this.setState({ sent: false }),\n      values: ['Accessibility', 'Practical learning', 'Inclusion', 'Responsible use of technology', 'Transparency and accountability', 'Community development'],\n      areas: [\n        { n: '01', title: 'AI Education', body: 'Accessible introductory learning that connects artificial intelligence concepts with practical everyday and workplace applications.' },\n        { n: '02', title: 'E-commerce Skills', body: 'Future learning opportunities related to online shops, digital customer service and online business operations.' },\n        { n: '03', title: 'Employment Readiness', body: 'Exploring ways to help participants understand emerging forms of digital work and develop relevant practical skills.' },\n        { n: '04', title: 'Business Support', body: 'Future knowledge-sharing initiatives for South African organisations interested in adopting artificial intelligence and digital tools.' },\n        { n: '05', title: 'Community Engagement', body: 'Potential partnerships and community initiatives that promote inclusive and socially beneficial uses of technology.' }\n      ],\n      legal: [\n        { k: 'Legal name', v: 'ChatGPT Foundation' },\n        { k: 'Entity type', v: 'South African Non-Profit Company' },\n        { k: 'Registration number', v: '2024/420153/08' },\n        { k: 'Registration date', v: '22 July 2024' },\n        { k: 'Country of registration', v: 'South Africa' },\n        { k: 'Financial year end', v: 'June' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
